 escopo_p1:"El <b>Proyecto COB – Conectando Orquestas Brasileñas</b> es una iniciativa dedicada a fomentar la colaboración entre orquestas de todo el país, buscando establecer una red colaborativa.",
 escopo_alvo_t:"Perfiles objetivo:", escopo_alvo:"Orquestas Sinfónicas y Filarmónicas, Comunitarias (con finalidad laica), de Proyectos o Programas Socioculturales, formalizadas o no, y de Universidades.",
 escopo_p2:"Para desarrollar sus acciones de forma más efectiva, el COB necesitó delimitar los perfiles participantes, considerando grupos con características y desafíos de gestión semejantes. Esta definición es una elección de alcance, sin ningún juicio ni desconsideración de los demás formatos, y contribuye a la coherencia de la red y a la realización de investigaciones y diagnósticos que puedan sustentar futuramente debates y propuestas de políticas públicas para las orquestas brasileñas.",
 escopo_p3:"Por ese motivo, en este momento el proyecto no contempla Orquestas de Iniciativa Privada (empresas), Orquestas de Cámara, Orquestas de Rabecas y de Viola Caipira, Cameratas, Bandas Sinfónicas, Cuartetos, entre otros grupos con estructuras artísticas y administrativas distintas del perfil definido por el COB.",

 terms_p1:"Mediante el presente <b>Término de Adhesión</b> manifiesto mi adhesión para la realización de Servicio Voluntario en el <b>COB — Conectando Orquestras Brasileiras</b>. Declaro conocer que, conforme la Ley nº 9.608 del 18/02/1998, mi participación no es remunerada ni genera vínculo laboral o previsional. El presente Término inicia a partir de su aprobación y podrá rescindirse en cualquier momento por cualquiera de las partes.",
